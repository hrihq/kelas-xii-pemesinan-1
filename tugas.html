 <link rel="stylesheet" href="css/style.css" />

 <body>

 <div class="nav-container">

 <main class="container">
 <div class="page-header">
 <h1>Daftar Tugas</h1>
 <p>Semua tugas kelas, diurutkan berdasarkan tenggat pengumpulan terdekat.</p>
 </div>

 <div class="card" style="margin-bottom:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
 <label for="filterMapel" style="font-weight:700;font-size:0.9rem">Filter Mapel:</label>
 <select
 id="filterMapel"
 style="padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:0.9rem;background:var(--paper);color:var(--ink);min-width:200px;cursor:pointer"
 >
 <option value="semua">Semua Mata Pelajaran</option>
 </select>
 <span id="jumlahTugas" style="color:var(--muted);font-size:0.88rem;margin-left:auto"></span>
 </div>

 <div id="tugasList"></div>
 </main>

 <footer class="footer">
 <div class="footer-inner">
 <div>&copy; 2026 Kelas XII PEMESINAN 1</div>
 <a href="admin/" class="admin-link">
 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
 Masuk Admin
 </a>
 </div>
 </footer>

 <div id="modalOverlay" class="modal-overlay"></div>

 <script src="js/app.js"></script>
 <script>
 let allTugas = [];
 document.addEventListener("DOMContentLoaded", async () => {
 const el = document.getElementById("tugasList");
 const select = document.getElementById("filterMapel");
 const jml = document.getElementById("jumlahTugas");
 showSkeleton(el, 3);

 try {
 allTugas = await fetchJSON("data/tugas.json");
 window.__DATA__ = window.__DATA__ || {};
 window.__DATA__.tugas = allTugas;

 // isi dropdown filter mapel
 const mapel = [...new Set(allTugas.map((t) => t.mapel).filter(Boolean))].sort();
 mapel.forEach((m) => {
 const opt = document.createElement("option");
 opt.value = m;
 opt.textContent = m;
 select.appendChild(opt);
 });

 const update = () => {
 renderTugasList(el, allTugas, 0, select.value);
 const n = select.value === "semua"
 ? allTugas.length
 : allTugas.filter((t) => t.mapel === select.value).length;
 jml.textContent = `${n} tugas ditampilkan`;
 revealAll();
 };
 select.addEventListener("change", update);
 update();
 } catch (err) {
 console.error(err);
 showError(el, err.message);
 }
 });
 </script>
 </body>
</html>
