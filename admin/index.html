<!DOCTYPE html>
<html lang="id">
 <head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Admin - Kelas XII PEMESINAN 1</title>
 <meta name="robots" content="noindex" />
 <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231a73e8%22/><text x=%2250%22 y=%2268%22 font-size=%2252%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22Arial%22>XII</text></svg>" />
 <style>
 body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #f8f9fa; }
 .cms-loading {
 position: fixed; inset: 0; display: flex; flex-direction: column;
 align-items: center; justify-content: center; gap: 14px; background: #f8f9fa;
 }
 .cms-loading .spinner {
 width: 38px; height: 38px; border: 3px solid #dadce0;
 border-top-color: #1a73e8; border-radius: 50%; animation: spin 1s linear infinite;
 }
 .cms-loading p { color: #5f6368; font-size: 0.95rem; }
 @keyframes spin { to { transform: rotate(360deg); } }
 </style>
 </head>
 <body>
 <div id="cms-loader" class="cms-loading">
 <div class="spinner"></div>
 <p>Memuat panel admin...</p>
 </div>

 <!-- Include Decap CMS dari CDN -->
 <script src="https://unpkg.com/decap-cms@^3.7.0/dist/decap-cms.js"></script>

 <script>
 // Sembunyikan loader setelah CMS siap
 if (window.decapCMS) {
 window.decapCMS.init();
 }
 window.addEventListener("load", () => {
 setTimeout(() => {
 const l = document.getElementById("cms-loader");
 if (l) l.style.display = "none";
 }, 2500);
 });
 </script>
 </body>
</html>
