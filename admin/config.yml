backend:
 name: github
 repo: USERNAME/kelas-xii-pemesinan-1 # GANTI: username GitHub & nama repo kamu
 branch: main
 base_url: https://NAMA-WORKER-KAMU.workers.dev # GANTI: URL Cloudflare Worker OAuth proxy
 auth_endpoint: auth
 auth_scope: repo

media_folder: "docs" # file PDF/foto yang di-upload admin disimpan di sini
public_folder: "/docs" # URL publik untuk dokumen tersebut

collections:
 # ===================== TUGAS =====================
 - name: "tugas"
 label: "Tugas"
 label_singular: "Tugas"
 folder: "content/tugas"
 create: true
 delete: true
 slug: "{{slug}}"
 summary: "{{title}} - {{mapel}} ({{deadline}})"
 fields:
 - { label: "Judul Tugas", name: "title", widget: "string", hint: "Contoh: Matematika - Bab 1: Limit" }
 - { label: "Mata Pelajaran", name: "mapel", widget: "string", hint: "Contoh: Matematika, Produktif, Bahasa Indonesia" }
 - { label: "Guru Pengampu", name: "teacher", widget: "string" }
 - { label: "Tenggat Pengumpulan", name: "deadline", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
 - label: "Status"
 name: "status"
 widget: "select"
 default: "Aktif"
 options: ["Aktif", "Selesai", "Ditunda"]
 - { label: "Ringkasan", name: "excerpt", widget: "text", required: false, hint: "Tampil di daftar tugas (1-2 kalimat)" }
 - { label: "Detail Lengkap", name: "body", widget: "markdown", hint: "Petunjuk pengerjaan, nomor soal, dll" }
 - { label: "Dokumen Pendukung", name: "document", widget: "file", required: false, hint: "Upload PDF/foto soal di sini" }

 # ===================== PENGUMUMAN =====================
 - name: "pengumuman"
 label: "Pengumuman"
 label_singular: "Pengumuman"
 folder: "content/pengumuman"
 create: true
 delete: true
 slug: "{{slug}}"
 summary: "{{date}} - {{title}}"
 fields:
 - { label: "Judul Pengumuman", name: "title", widget: "string" }
 - { label: "Tanggal", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
 - label: "Status"
 name: "status"
 widget: "select"
 default: "Aktif"
 options: ["Aktif", "Selesai", "Ditunda"]
 - { label: "Diposting Oleh", name: "author", widget: "string", default: "Admin" }
 - { label: "Ringkasan", name: "excerpt", widget: "text", required: false }
 - { label: "Isi Pengumuman", name: "body", widget: "markdown" }
 - { label: "Dokumen Pendukung", name: "document", widget: "file", required: false, hint: "Upload PDF/foto pendukung" }

 # ===================== PROFIL KELAS =====================
 - name: "profil"
 label: "Profil Kelas"
 delete: false
 create: false
 files:
 - file: "content/profil.md"
 name: "profil"
 label: "Profil Kelas"
 fields:
 - label: "Informasi Kelas"
 name: "info"
 widget: "object"
 fields:
 - { label: "Nama Sekolah", name: "Nama Sekolah", widget: "string" }
 - { label: "Nama Kelas", name: "Nama Kelas", widget: "string", default: "XII PEMESINAN 1" }
 - { label: "Jurusan", name: "Jurusan", widget: "string", default: "Teknik Pemesinan" }
 - { label: "Wali Kelas", name: "Wali Kelas", widget: "string" }
 - { label: "Tahun Ajaran", name: "Tahun Ajaran", widget: "string", default: "2026/2027" }
 - { label: "Jumlah Siswa", name: "Jumlah Siswa", widget: "string" }
 - label: "Struktur Organisasi"
 name: "struktur"
 widget: "list"
 required: false
 fields:
 - { label: "Jabatan", name: "jabatan", widget: "string" }
 - { label: "Nama", name: "nama", widget: "string" }
 - label: "Kontak"
 name: "kontak"
 widget: "list"
 required: false
 fields:
 - { label: "Jabatan", name: "jabatan", widget: "string" }
 - { label: "Nama", name: "nama", widget: "string" }
 - { label: "No. Telepon", name: "telepon", widget: "string", required: false }
 - { label: "Email", name: "email", widget: "string", required: false }
