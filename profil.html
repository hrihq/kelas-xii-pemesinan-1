 <script src="js/app.js?v5"></script>
 <script>
 document.addEventListener("DOMContentLoaded", async () => {
 const elInfo = document.getElementById("infoKelas");
 const elStruktur = document.getElementById("strukturKelas");
 const elKontak = document.getElementById("kontakKelas");
 elStruktur.innerHTML = `<div class="skel"><div class="sk" style="width:70%;height:20px"></div></div>`;
 elKontak.innerHTML = `<div class="skel"><div class="sk" style="width:70%;height:20px"></div></div>`;

 try {
 const p = await fetchJSON("data/profil.json");

 // Informasi kelas
 elInfo.innerHTML = Object.entries(p.info || {})
 .map(
 ([k, v]) => `
 <div class="profile-item reveal">
 <div class="label">${esc(k)}</div>
 <div class="value">${esc(v)}</div>
 </div>`
 )
 .join("");

 // Struktur kelas
 const struktur = p.struktur || [];
 elStruktur.innerHTML = struktur.length
 ? struktur
 .map(
 (s) => `
 <div class="card hoverable reveal">
 <h3>${esc(s.jabatan)}</h3>
 <p style="color:var(--ink);font-weight:600;margin-top:4px">${esc(s.nama)}</p>
 </div>`
 )
 .join("")
 : `<div class="card"><p>Belum ada data struktur kelas.</p></div>`;

 // Kontak
 const kontak = p.kontak || [];
 elKontak.innerHTML = kontak.length
 ? kontak
 .map(
 (k) => `
 <div class="card reveal">
 <h3>${esc(k.jabatan)}</h3>
 <p style="color:var(--ink);font-weight:600;margin:4px 0 10px">${esc(k.nama)}</p>
 ${k.telepon ? `<p style="margin-bottom:6px"><a href="https://wa.me/${esc(String(k.telepon).replace(/^0/, "62"))}" target="_blank" rel="noopener">${esc(k.telepon)}</a></p>` : ""}
 ${k.email ? `<p><a href="mailto:${esc(k.email)}">${esc(k.email)}</a></p>` : ""}
 ${!k.telepon && !k.email ? `<p>Belum ada kontak.</p>` : ""}
 </div>`
 )
 .join("")
 : `<div class="card"><p>Belum ada data kontak.</p></div>`;

 revealAll();
 } catch (err) {
 console.error(err);
 showError(elInfo, err.message);
 }
 });
 </script>
